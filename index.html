<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>磐宇-產品目錄</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=58" />
</head>
<body>
  <header class="site-header site-header-hero">
    <div class="site-header-row">
      <div class="site-header-title">
        <img src="logo.png" alt="磐宇生物科技" class="site-logo" />
        <h1>磐宇-產品目錄</h1>
      </div>
    </div>
    <svg class="site-header-wave" viewBox="0 0 1440 60" preserveAspectRatio="none"><path d="M0 30c240 30 480 30 720 15s480-30 720 0v15H0z"/></svg>
  </header>

  <main>
    <p id="dataSourceHint" class="hint-text" style="display:none;"></p>

    <div class="toolbar">
      <div class="search-input-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="搜尋商品名稱、分類、規格關鍵字..." />
      </div>
    </div>
    <div id="categoryFilterChips" class="category-filter-chips"></div>

    <div id="productOverview" class="product-overview"></div>
    <div id="productGrid"></div>
    <div id="emptyState" class="empty-state" style="display:none;">目前沒有符合條件的產品</div>
  </main>

  <footer id="siteFooter" class="site-footer" style="display:none;"></footer>

  <button type="button" id="backToOverviewBtn" class="back-to-overview" style="display:none;">↑ 回到總覽</button>

  <script type="module" src="app.js?v=58"></script>
</body>
</html>
