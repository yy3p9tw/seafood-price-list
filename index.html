<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>產品價目表</title>
  <link rel="stylesheet" href="style.css?v=24" />
</head>
<body>
  <header class="site-header">
    <h1>產品價目表</h1>
    <nav>
      <a href="#" id="salesModeToggle">業務登入</a>
      <a href="admin.html">後台管理</a>
    </nav>
  </header>

  <main>
    <p id="dataSourceHint" class="hint-text" style="display:none;"></p>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="搜尋商品名稱、分類、規格關鍵字..." />
      <select id="categoryFilter">
        <option value="">全部分類</option>
      </select>
    </div>

    <div id="productOverview" class="product-overview"></div>
    <div id="productGrid"></div>
    <div id="emptyState" class="empty-state" style="display:none;">目前沒有符合條件的產品</div>
  </main>

  <button type="button" id="backToOverviewBtn" class="back-to-overview" style="display:none;">↑ 回到總覽</button>

  <div id="salesLoginModal" class="sales-login-modal">
    <div class="sales-login-box">
      <h2>業務登入</h2>
      <form id="salesLoginForm">
        <input type="text" id="salesAccountInput" placeholder="帳號" autocomplete="username" />
        <input type="password" id="salesPasswordInput" placeholder="密碼" autocomplete="current-password" />
        <div class="error-text" id="salesLoginError"></div>
        <button type="submit" style="width:100%;">登入</button>
        <button type="button" id="salesLoginCancelBtn" class="secondary" style="width:100%; margin-top:8px;">取消</button>
      </form>
    </div>
  </div>

  <script type="module" src="app.js?v=24"></script>
</body>
</html>
